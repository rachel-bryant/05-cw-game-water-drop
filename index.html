<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="title-row">
            <img src="https://seeklogo.com/images/C/charity-water-logo-9121D887A9-seeklogo.com.png">
            <h1 class="game-title">Water Drop</h1>
        </div>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <button id="start-btn">Start Game</button>
        </div>
        
        <div id="game-container">
        </div>
    </div> 
    
    <div id="end-screen">
      <h1>Nice job!</h1>
      <p>You got <span id="points"></span> points!</p>
      <button onclick="startGame()">Start New Game</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
